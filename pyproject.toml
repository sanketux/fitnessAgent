[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-agent"
version = "0.1.0"
description = "Daily health and fitness coaching agent built on the Claude API"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fitness-agent = "fitness_agent.cli:main"

[tool.setuptools.packages.find]
include = ["fitness_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
